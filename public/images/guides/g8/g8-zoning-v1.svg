<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>Map the interfaces before the layout</title><desc>Editorial zoning diagram: dry play, optional mist, shaded rest, arrival and service review.</desc>
<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#E6F2EF"/><stop offset="1" stop-color="#FAF8F3"/></linearGradient><linearGradient id="mist"><stop stop-color="#BFE4E6" stop-opacity=".15"/><stop offset=".5" stop-color="#F6FFFF" stop-opacity=".9"/><stop offset="1" stop-color="#BFE4E6" stop-opacity=".15"/></linearGradient><pattern id="wet" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M0 22L22 0" stroke="#258C94" stroke-opacity=".22" stroke-width="2"/></pattern></defs>
<rect width="1600" height="1000" fill="#FAF8F3"/><g font-family="Arial,sans-serif"><text x="64" y="61" font-size="20" fill="#167D85" font-weight="700" text-anchor="start">MISTING PLAYGROUND / PROCUREMENT GUIDE</text><text x="64" y="125" font-size="43" fill="#123B49" font-weight="700" text-anchor="start">Map the interfaces before the layout</text><text x="64" y="173" font-size="25" fill="#536D72" font-weight="400" text-anchor="start">Conceptual relationships only. Zone edges are not safety clearances or verified spray limits.</text><path d="M64 211H1536" fill="none" stroke="#D3DEDA" stroke-width="2" /><rect x="64" y="247" width="972" height="615" rx="18" fill="#EDE2D0" stroke="none" /><rect x="105" y="295" width="398" height="292" rx="30" fill="#E1E8D5" stroke="none" /><circle cx="142" cy="334" r="23" fill="#167D85" stroke="none" /><text x="142" y="342" font-size="23" fill="white" font-weight="700" text-anchor="middle">1</text><text x="183" y="344" font-size="28" fill="#123B49" font-weight="700" text-anchor="start">DRY PLAY</text><path d="M166 507L210 426L268 439L293 510Z" fill="#88A993" stroke="none" stroke-width="3" /><path d="M253 448L323 532H360" fill="none" stroke="#D47961" stroke-width="16" stroke-linecap="round"/><text x="134" y="556" font-size="23" fill="#123B49" font-weight="400" text-anchor="start">Climbing, slide and exploration</text><rect x="623" y="295" width="367" height="204" rx="28" fill="#F8F3E8" stroke="#167D85" stroke-width="2"/><circle cx="661" cy="334" r="23" fill="#167D85" stroke="none" /><text x="661" y="342" font-size="23" fill="white" font-weight="700" text-anchor="middle">2</text><text x="699" y="344" font-size="27" fill="#123B49" font-weight="700" text-anchor="start">SHADED REST</text><text x="649" y="395" font-size="24" fill="#123B49" font-weight="400" text-anchor="start">Supervision and sightlines</text><path d="M663 446L807 417L944 450Z" fill="#D1BC95" stroke="none" stroke-width="3" /><rect x="640" y="579" width="350" height="175" rx="28" fill="#CCE6E5" stroke="#167D85" stroke-width="2" stroke-dasharray="8 7"/><rect x="640" y="579" width="350" height="175" rx="28" fill="url(#wet)" stroke="none" /><circle cx="679" cy="618" r="23" fill="#167D85" stroke="none" /><text x="679" y="626" font-size="23" fill="white" font-weight="700" text-anchor="middle">3</text><text x="717" y="628" font-size="26" fill="#123B49" font-weight="700" text-anchor="start">OPTIONAL MIST</text><text x="666" y="680" font-size="23" fill="#123B49" font-weight="400" text-anchor="start">Assess drift and wet surfaces</text><text x="666" y="720" font-size="22" fill="#123B49" font-weight="400" text-anchor="start">Boundary is unverified</text><path d="M113 787H554V660H589V405" fill="none" stroke="#FFFDF7" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/><text x="121" y="832" font-size="24" fill="#123B49" font-weight="600" text-anchor="start">Arrival / circulation concept</text><path d="M908 810H1008V533H925" fill="none" stroke="#7B8D81" stroke-width="3" stroke-dasharray="8 7"/><text x="681" y="850" font-size="22" fill="#536D72" font-weight="400" text-anchor="start">Service access to assess</text><circle cx="1102" cy="285" r="23" fill="#167D85" stroke="none" /><text x="1102" y="293" font-size="23" fill="white" font-weight="700" text-anchor="middle">1</text><text x="1142" y="294" font-size="26" fill="#123B49" font-weight="700" text-anchor="start">Keep interfaces explicit</text><text x="1078" y="339" font-size="23" fill="#123B49" font-weight="400" text-anchor="start">Review exits, buffers, surfacing</text><text x="1078" y="375" font-size="23" fill="#123B49" font-weight="400" text-anchor="start">and the route between activities.</text><circle cx="1102" cy="436" r="23" fill="#167D85" stroke="none" /><text x="1102" y="444" font-size="23" fill="white" font-weight="700" text-anchor="middle">2</text><text x="1142" y="445" font-size="26" fill="#123B49" font-weight="700" text-anchor="start">Check access and care</text><text x="1078" y="490" font-size="23" fill="#123B49" font-weight="400" text-anchor="start">Assess accessible circulation,</text><text x="1078" y="526" font-size="23" fill="#123B49" font-weight="400" text-anchor="start">supervision and maintenance.</text><circle cx="1102" cy="587" r="23" fill="#167D85" stroke="none" /><text x="1102" y="595" font-size="23" fill="white" font-weight="700" text-anchor="middle">3</text><text x="1142" y="596" font-size="26" fill="#123B49" font-weight="700" text-anchor="start">Plan for mist off</text><text x="1078" y="641" font-size="23" fill="#123B49" font-weight="400" text-anchor="start">Confirm drift, drainage, hygiene</text><text x="1078" y="677" font-size="23" fill="#123B49" font-weight="400" text-anchor="start">and dry-mode operation.</text><rect x="1075" y="727" width="461" height="121" rx="18" fill="#E8EEEA" stroke="none" /><text x="1096" y="769" font-size="21" fill="#167D85" font-weight="700" text-anchor="start">NO DIMENSIONS OR SAFETY RADII</text><text x="1096" y="810" font-size="24" fill="#123B49" font-weight="400" text-anchor="start">Obtain a project-specific layout.</text><path d="M64 897H1536" fill="none" stroke="#D3DEDA" stroke-width="2" /><text x="64" y="940" font-size="22" fill="#536D72" font-weight="400" text-anchor="start">Editorial interface diagram only. No engineered layout, safe separation or drainage capacity is established.</text><text x="64" y="975" font-size="19" fill="#536D72" font-weight="400" text-anchor="start">Original vector editorial concept • Not to scale • No AQUASEE product or delivered project depicted</text></g></svg>