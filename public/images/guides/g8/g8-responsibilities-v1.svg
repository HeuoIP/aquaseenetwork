<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>One brief. Four interfaces to agree.</title><desc>Procurement diagram relating play, shade, water and operations around a common site brief.</desc>
<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#E6F2EF"/><stop offset="1" stop-color="#FAF8F3"/></linearGradient><linearGradient id="mist"><stop stop-color="#BFE4E6" stop-opacity=".15"/><stop offset=".5" stop-color="#F6FFFF" stop-opacity=".9"/><stop offset="1" stop-color="#BFE4E6" stop-opacity=".15"/></linearGradient><pattern id="wet" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M0 22L22 0" stroke="#258C94" stroke-opacity=".22" stroke-width="2"/></pattern></defs>
<rect width="1600" height="900" fill="#FAF8F3"/><g font-family="Arial,sans-serif"><text x="64" y="61" font-size="20" fill="#167D85" font-weight="700" text-anchor="start">MISTING PLAYGROUND / PROCUREMENT GUIDE</text><text x="64" y="125" font-size="43" fill="#123B49" font-weight="700" text-anchor="start">One brief. Four interfaces to agree.</text><text x="64" y="173" font-size="25" fill="#536D72" font-weight="400" text-anchor="start">Identify the responsible parties, their scope and the information still needed.</text><path d="M64 211H1536" fill="none" stroke="#D3DEDA" stroke-width="2" /><path d="M501 366H610" fill="none" stroke="#99B5B4" stroke-width="3" /><path d="M990 366H1099" fill="none" stroke="#99B5B4" stroke-width="3" /><path d="M501 664H610" fill="none" stroke="#99B5B4" stroke-width="3" /><path d="M990 664H1099" fill="none" stroke="#99B5B4" stroke-width="3" /><rect x="599" y="332" width="402" height="366" rx="26" fill="#123B49" stroke="none" /><text x="800" y="398" font-size="33" fill="white" font-weight="700" text-anchor="middle">SITE BRIEF</text><text x="800" y="450" font-size="25" fill="#E5EFEB" font-weight="500" text-anchor="middle">Location • users • age</text><text x="800" y="492" font-size="25" fill="#E5EFEB" font-weight="500" text-anchor="middle">Use hours • climate</text><text x="800" y="534" font-size="25" fill="#E5EFEB" font-weight="500" text-anchor="middle">Survey • utilities</text><text x="800" y="576" font-size="25" fill="#E5EFEB" font-weight="500" text-anchor="middle">Budget • scope</text><text x="800" y="638" font-size="25" fill="#E5EFEB" font-weight="500" text-anchor="middle">Who closes each gap?</text><rect x="64" y="251" width="437" height="234" rx="18" fill="#E8EFEB" stroke="none" /><text x="89" y="298" font-size="24" fill="#167D85" font-weight="700" text-anchor="start">PLAY</text><text x="89" y="345" font-size="29" fill="#123B49" font-weight="700" text-anchor="start">Designer / installer</text><text x="89" y="395" font-size="21" fill="#123B49" font-weight="400" text-anchor="start">Confirm play and installation scope.</text><text x="89" y="435" font-size="21" fill="#123B49" font-weight="400" text-anchor="start">Age, surfacing, exits, handover.</text><rect x="1099" y="251" width="437" height="234" rx="18" fill="#E8EFEB" stroke="none" /><text x="1124" y="298" font-size="24" fill="#167D85" font-weight="700" text-anchor="start">SHADE</text><text x="1124" y="345" font-size="29" fill="#123B49" font-weight="700" text-anchor="start">Structure specialist</text><text x="1124" y="395" font-size="21" fill="#123B49" font-weight="400" text-anchor="start">Confirm design and site interfaces.</text><text x="1124" y="435" font-size="21" fill="#123B49" font-weight="400" text-anchor="start">Coverage, supports, inspection.</text><rect x="64" y="549" width="437" height="234" rx="18" fill="#DCEEEF" stroke="none" /><text x="89" y="596" font-size="24" fill="#167D85" font-weight="700" text-anchor="start">WATER</text><text x="89" y="643" font-size="29" fill="#123B49" font-weight="700" text-anchor="start">Water specialist</text><text x="89" y="693" font-size="21" fill="#123B49" font-weight="400" text-anchor="start">Confirm water-system responsibilities.</text><text x="89" y="733" font-size="21" fill="#123B49" font-weight="400" text-anchor="start">Source, hygiene, drainage, servicing.</text><rect x="1099" y="549" width="437" height="234" rx="18" fill="#E8EFEB" stroke="none" /><text x="1124" y="596" font-size="24" fill="#167D85" font-weight="700" text-anchor="start">OPERATIONS</text><text x="1124" y="643" font-size="29" fill="#123B49" font-weight="700" text-anchor="start">Site operator</text><text x="1124" y="693" font-size="21" fill="#123B49" font-weight="400" text-anchor="start">Confirm who runs and maintains it.</text><text x="1124" y="733" font-size="21" fill="#123B49" font-weight="400" text-anchor="start">Checks, mist off, shutdown, records.</text><path d="M64 802H1536" fill="none" stroke="#D3DEDA" stroke-width="2" /><text x="64" y="845" font-size="22" fill="#536D72" font-weight="400" text-anchor="start">Responsibilities to agree in the proposal — these labels do not identify services supplied by AQUASEE.</text><text x="64" y="880" font-size="19" fill="#536D72" font-weight="400" text-anchor="start">Original vector editorial concept • Not to scale • No AQUASEE product or delivered project depicted</text></g></svg>