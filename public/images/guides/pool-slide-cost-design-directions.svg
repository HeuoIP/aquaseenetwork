<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="680" viewBox="0 0 1500 680" role="img" aria-labelledby="title desc">
  <title id="title">Three residential pool slide design directions</title>
  <desc id="desc">Editorial silhouettes for compact, curved, and landscape integrated pool slides. Conceptual comparison, not product models or installation drawings.</desc>
  <rect width="1500" height="680" fill="#f1eee7"/>
  <text x="60" y="74" fill="#0c1013" font-family="Arial,sans-serif" font-size="34" font-weight="700">Design direction changes the project scope</text>
  <text x="60" y="115" fill="#48525a" font-family="Arial,sans-serif" font-size="19">Compare the form, its support and the space around the pool before comparing prices.</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(50 160)">
      <rect width="445" height="420" rx="12" fill="#fbfaf8" stroke="#d2cec5"/>
      <text x="28" y="45" fill="#0e5a54" font-size="15" font-weight="700" letter-spacing="2">01 / COMPACT</text>
      <rect x="28" y="294" width="389" height="86" rx="5" fill="#9ecac7"/>
      <path d="M63 255 H242 Q268 255 281 282 L292 294" fill="none" stroke="#778993" stroke-width="43" stroke-linecap="round"/>
      <path d="M63 255 H242 Q268 255 281 282 L292 294" fill="none" stroke="#e5ebeb" stroke-width="32" stroke-linecap="round"/>
      <path d="M59 174 V245 M76 174 V245 M59 174 H76" fill="none" stroke="#778993" stroke-width="8"/>
      <text x="28" y="402" fill="#48525a" font-size="17">Check full footprint and access.</text>
    </g>
    <g transform="translate(528 160)">
      <rect width="445" height="420" rx="12" fill="#fbfaf8" stroke="#d2cec5"/>
      <text x="28" y="45" fill="#0e5a54" font-size="15" font-weight="700" letter-spacing="2">02 / CURVED</text>
      <rect x="28" y="294" width="389" height="86" rx="5" fill="#9ecac7"/>
      <path d="M78 178 C299 175 95 280 306 306" fill="none" stroke="#778993" stroke-width="43" stroke-linecap="round"/>
      <path d="M78 178 C299 175 95 280 306 306" fill="none" stroke="#e5ebeb" stroke-width="32" stroke-linecap="round"/>
      <path d="M72 158 V108 M88 158 V108 M72 108 H88" fill="none" stroke="#778993" stroke-width="8"/>
      <text x="28" y="402" fill="#48525a" font-size="17">Check the path and exit direction.</text>
    </g>
    <g transform="translate(1006 160)">
      <rect width="445" height="420" rx="12" fill="#fbfaf8" stroke="#d2cec5"/>
      <text x="28" y="45" fill="#0e5a54" font-size="15" font-weight="700" letter-spacing="2">03 / LANDSCAPE INTEGRATED</text>
      <rect x="28" y="294" width="389" height="86" rx="5" fill="#9ecac7"/>
      <path d="M38 238 C94 192 148 219 200 224 S274 264 304 300" fill="none" stroke="#d6c8ac" stroke-width="93" stroke-linecap="round"/>
      <path d="M76 210 C153 204 222 234 304 300" fill="none" stroke="#778993" stroke-width="43" stroke-linecap="round"/>
      <path d="M76 210 C153 204 222 234 304 300" fill="none" stroke="#e5ebeb" stroke-width="32" stroke-linecap="round"/>
      <circle cx="352" cy="211" r="28" fill="#a5b9a1"/><circle cx="393" cy="228" r="18" fill="#b8c9a8"/>
      <text x="28" y="402" fill="#48525a" font-size="17">Check grading, services and upkeep.</text>
    </g>
  </g>
  <text x="60" y="630" fill="#7c858d" font-family="Arial,sans-serif" font-size="17">Editorial concept diagram · Not AQUASEE product models · Not to scale</text>
</svg>
