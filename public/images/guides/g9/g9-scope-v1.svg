<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>Compare the same scope in every quote</title><desc>Editorial scope matrix for climbing, shade, optional misting and site/operator responsibilities.</desc><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#E3F0EC"/><stop offset="1" stop-color="#FAF7EF"/></linearGradient><linearGradient id="mist"><stop stop-color="#D3ECEB" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".9"/><stop offset="1" stop-color="#D3ECEB" stop-opacity="0"/></linearGradient></defs><rect width="1600" height="900" fill="#FAF8F3"/><g font-family="Arial,sans-serif"><text x="64" y="58" font-size="20" fill="#127E86" font-weight="700" text-anchor="start">CLIMBING NETS / SHADE / OPTIONAL MISTING</text><text x="64" y="121" font-size="43" fill="#163D4A" font-weight="700" text-anchor="start">Compare the same scope in every quote</text><text x="64" y="168" font-size="24" fill="#526C71" font-weight="400" text-anchor="start">For each package, record inclusions, exclusions, responsible parties and evidence still needed.</text><path d="M64 207H1536" fill="none" stroke="#D3DFD8" stroke-width="2" /><rect x="64" y="247" width="350" height="505" rx="18" fill="#DCE6D6" stroke="none" /><text x="84" y="290" font-size="23" fill="#163D4A" font-weight="700" text-anchor="start">CLIMBING PACKAGE</text><text x="84" y="344" font-size="20" fill="#127E86" font-weight="700" text-anchor="start">Equipment and scope</text><text x="84" y="383" font-size="21" fill="#163D4A" font-weight="400" text-anchor="start">Net or complete climber?</text><text x="84" y="419" font-size="21" fill="#163D4A" font-weight="400" text-anchor="start">Ropes, fittings, surfacing?</text><text x="84" y="487" font-size="20" fill="#127E86" font-weight="700" text-anchor="start">Responsibilities to agree</text><text x="84" y="526" font-size="21" fill="#163D4A" font-weight="400" text-anchor="start">Supplier and installer</text><text x="84" y="562" font-size="21" fill="#163D4A" font-weight="400" text-anchor="start">Inspection and repair owner</text><text x="84" y="630" font-size="20" fill="#127E86" font-weight="700" text-anchor="start">Evidence to request</text><text x="84" y="669" font-size="21" fill="#163D4A" font-weight="400" text-anchor="start">Actual model documents</text><text x="84" y="705" font-size="21" fill="#163D4A" font-weight="400" text-anchor="start">Use, care and warranty scope</text><rect x="438" y="247" width="350" height="505" rx="18" fill="#EDE3CF" stroke="none" /><text x="458" y="290" font-size="23" fill="#163D4A" font-weight="700" text-anchor="start">SHADE PACKAGE</text><text x="458" y="344" font-size="20" fill="#127E86" font-weight="700" text-anchor="start">Equipment and scope</text><text x="458" y="383" font-size="21" fill="#163D4A" font-weight="400" text-anchor="start">Cover, supports, foundations</text><text x="458" y="419" font-size="21" fill="#163D4A" font-weight="400" text-anchor="start">Interfaces with climbing?</text><text x="458" y="487" font-size="20" fill="#127E86" font-weight="700" text-anchor="start">Responsibilities to agree</text><text x="458" y="526" font-size="21" fill="#163D4A" font-weight="400" text-anchor="start">Shade / structure designer</text><text x="458" y="562" font-size="21" fill="#163D4A" font-weight="400" text-anchor="start">Installer and inspection owner</text><text x="458" y="630" font-size="20" fill="#127E86" font-weight="700" text-anchor="start">Evidence to request</text><text x="458" y="669" font-size="21" fill="#163D4A" font-weight="400" text-anchor="start">Time-based shade objectives</text><text x="458" y="705" font-size="21" fill="#163D4A" font-weight="400" text-anchor="start">Design and maintenance scope</text><rect x="812" y="247" width="350" height="505" rx="18" fill="#DCEDEE" stroke="none" /><text x="832" y="290" font-size="23" fill="#163D4A" font-weight="700" text-anchor="start">MISTING PACKAGE</text><text x="832" y="344" font-size="20" fill="#127E86" font-weight="700" text-anchor="start">Equipment and scope</text><text x="832" y="383" font-size="21" fill="#163D4A" font-weight="400" text-anchor="start">Water, controls, utilities</text><text x="832" y="419" font-size="21" fill="#163D4A" font-weight="400" text-anchor="start">Drainage and servicing?</text><text x="832" y="487" font-size="20" fill="#127E86" font-weight="700" text-anchor="start">Responsibilities to agree</text><text x="832" y="526" font-size="21" fill="#163D4A" font-weight="400" text-anchor="start">System supplier / trades</text><text x="832" y="562" font-size="21" fill="#163D4A" font-weight="400" text-anchor="start">Water-management specialist</text><text x="832" y="630" font-size="20" fill="#127E86" font-weight="700" text-anchor="start">Evidence to request</text><text x="832" y="669" font-size="21" fill="#163D4A" font-weight="400" text-anchor="start">Wetting and drift assessment</text><text x="832" y="705" font-size="21" fill="#163D4A" font-weight="400" text-anchor="start">Shutdown, restart and care</text><rect x="1186" y="247" width="350" height="505" rx="18" fill="#EADBD2" stroke="none" /><text x="1206" y="290" font-size="23" fill="#163D4A" font-weight="700" text-anchor="start">SITE / OPERATOR</text><text x="1206" y="344" font-size="20" fill="#127E86" font-weight="700" text-anchor="start">Equipment and scope</text><text x="1206" y="383" font-size="21" fill="#163D4A" font-weight="400" text-anchor="start">Site works and access</text><text x="1206" y="419" font-size="21" fill="#163D4A" font-weight="400" text-anchor="start">Handover and running costs</text><text x="1206" y="487" font-size="20" fill="#127E86" font-weight="700" text-anchor="start">Responsibilities to agree</text><text x="1206" y="526" font-size="21" fill="#163D4A" font-weight="400" text-anchor="start">Local site team and operator</text><text x="1206" y="562" font-size="21" fill="#163D4A" font-weight="400" text-anchor="start">Who closes scope gaps?</text><text x="1206" y="630" font-size="20" fill="#127E86" font-weight="700" text-anchor="start">Evidence to request</text><text x="1206" y="669" font-size="21" fill="#163D4A" font-weight="400" text-anchor="start">Commissioning and records</text><text x="1206" y="705" font-size="21" fill="#163D4A" font-weight="400" text-anchor="start">Named tasks and exclusions</text><rect x="64" y="774" width="1472" height="37" rx="10" fill="#E9EEEA" stroke="none" /><text x="800" y="800" font-size="22" fill="#163D4A" font-weight="600" text-anchor="middle">Assign each responsibility explicitly; one contractor may not supply every package.</text><path d="M64 815H1536" fill="none" stroke="#D3DFD8" stroke-width="2" /><text x="64" y="855" font-size="22" fill="#526C71" font-weight="400" text-anchor="start">Scope questions to agree — not AQUASEE engineering, installation or water-service commitments.</text><text x="64" y="889" font-size="19" fill="#526C71" font-weight="400" text-anchor="start">Original vector editorial concept • Not to scale • No delivered AQUASEE project or available SKU depicted</text></g></svg>