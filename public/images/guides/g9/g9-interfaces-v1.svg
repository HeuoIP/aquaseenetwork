<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>Assess the interfaces, not just the net</title><desc>Climbing, independent shade and optional misting questions around an unassessed concept.</desc><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#E3F0EC"/><stop offset="1" stop-color="#FAF7EF"/></linearGradient><linearGradient id="mist"><stop stop-color="#D3ECEB" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".9"/><stop offset="1" stop-color="#D3ECEB" stop-opacity="0"/></linearGradient></defs><rect width="1600" height="1000" fill="#FAF8F3"/><g font-family="Arial,sans-serif"><text x="64" y="58" font-size="20" fill="#127E86" font-weight="700" text-anchor="start">CLIMBING NETS / SHADE / OPTIONAL MISTING</text><text x="64" y="121" font-size="43" fill="#163D4A" font-weight="700" text-anchor="start">Assess the interfaces, not just the net</text><text x="64" y="168" font-size="24" fill="#526C71" font-weight="400" text-anchor="start">An editorial concept: visible separation does not establish safe clearance or a verified dry zone.</text><path d="M64 207H1536" fill="none" stroke="#D3DFD8" stroke-width="2" /><rect x="64" y="247" width="920" height="610" rx="20" fill="#E9DFCA" stroke="none" /><text x="95" y="291" font-size="20" fill="#127E86" font-weight="700" text-anchor="start">CLIMBING / SHADE / OPTIONAL MISTING</text><path d="M135 634V363M706 638V353M890 576V320" fill="none" stroke="#163D4A" stroke-width="9" /><path d="M135 363Q415 414 890 320Q831 381 706 353Q421 438 135 363Z" fill="#FFF9E9" stroke="#CBB896" stroke-width="2" /><g transform="translate(185 404) scale(0.94)"><path d="M0 270L70 0M490 295L455 45" fill="none" stroke="#163D4A" stroke-width="16" stroke-linecap="round"/><path d="M70 35Q251 100 455 80L476 267Q250 215 17 239Z" fill="#B9D2BC" stroke="#8C7756" stroke-width="5" /><path d="M63.375 60.5Q250 108.5 457.625 103.375" fill="none" stroke="#E5C49C" stroke-width="5" /><path d="M56.75 86.0Q250 134.0 460.25 126.75" fill="none" stroke="#E5C49C" stroke-width="5" /><path d="M50.125 111.5Q250 159.5 462.875 150.125" fill="none" stroke="#E5C49C" stroke-width="5" /><path d="M43.5 137.0Q250 185.0 465.5 173.5" fill="none" stroke="#E5C49C" stroke-width="5" /><path d="M36.875 162.5Q250 210.5 468.125 196.875" fill="none" stroke="#E5C49C" stroke-width="5" /><path d="M30.25 188.0Q250 236.0 470.75 220.25" fill="none" stroke="#E5C49C" stroke-width="5" /><path d="M23.625 213.5Q250 261.5 473.375 243.625" fill="none" stroke="#E5C49C" stroke-width="5" /><path d="M105.0 45.371900826446286Q95.0 139.82231404958677 58.72727272727273 234.27272727272725" fill="none" stroke="#E5C49C" stroke-width="5" /><path d="M140.0 54.48760330578512Q130.0 142.74380165289256 100.45454545454545 231.0" fill="none" stroke="#E5C49C" stroke-width="5" /><path d="M175.0 62.34710743801653Q165.0 145.76446280991735 142.1818181818182 229.1818181818182" fill="none" stroke="#E5C49C" stroke-width="5" /><path d="M210.0 68.95041322314049Q200.0 148.88429752066116 183.9090909090909 228.8181818181818" fill="none" stroke="#E5C49C" stroke-width="5" /><path d="M245.0 74.29752066115702Q235.0 152.10330578512395 225.63636363636363 229.9090909090909" fill="none" stroke="#E5C49C" stroke-width="5" /><path d="M280.0 78.38842975206612Q270.0 155.4214876033058 267.3636363636364 232.45454545454547" fill="none" stroke="#E5C49C" stroke-width="5" /><path d="M315.0 81.22314049586777Q305.0 158.8388429752066 309.09090909090907 236.45454545454544" fill="none" stroke="#E5C49C" stroke-width="5" /><path d="M350.0 82.80165289256198Q340.0 162.35537190082647 350.8181818181818 241.90909090909093" fill="none" stroke="#E5C49C" stroke-width="5" /><path d="M385.0 83.12396694214875Q375.0 165.9710743801653 392.54545454545456 248.81818181818184" fill="none" stroke="#E5C49C" stroke-width="5" /><path d="M420.0 82.19008264462809Q410.0 169.68595041322314 434.27272727272725 257.1818181818182" fill="none" stroke="#E5C49C" stroke-width="5" /></g><ellipse cx="817" cy="741" rx="118" ry="35" fill="#B7D8D5"/><path d="M805 737Q783 709 808 688Q834 675 837 708L825 739Z" fill="#127E86" stroke="none" stroke-width="3" /><ellipse cx="758" cy="681" rx="40" ry="24" fill="url(#mist)"/><ellipse cx="796" cy="656" rx="40" ry="24" fill="url(#mist)"/><ellipse cx="849" cy="662" rx="40" ry="24" fill="url(#mist)"/><ellipse cx="887" cy="689" rx="40" ry="24" fill="url(#mist)"/><path d="M109 780H616" fill="none" stroke="#FFFDF7" stroke-width="32" stroke-linecap="round"/><text x="113" y="824" font-size="23" fill="#163D4A" font-weight="600" text-anchor="start">Circulation and supervision to assess</text><circle cx="244" cy="346" r="22" fill="#127E86"/><text x="244" y="354" font-size="23" fill="white" font-weight="700" text-anchor="middle">1</text><circle cx="524" cy="616" r="22" fill="#127E86"/><text x="524" y="624" font-size="23" fill="white" font-weight="700" text-anchor="middle">2</text><circle cx="883" cy="674" r="22" fill="#127E86"/><text x="883" y="682" font-size="23" fill="white" font-weight="700" text-anchor="middle">3</text><circle cx="1041" cy="281" r="22" fill="#127E86"/><text x="1041" y="289" font-size="23" fill="white" font-weight="700" text-anchor="middle">1</text><text x="1081" y="289" font-size="28" fill="#163D4A" font-weight="700" text-anchor="start">SHADE</text><text x="1019" y="334" font-size="23" fill="#163D4A" font-weight="400" text-anchor="start">Assess dates, hours and coverage.</text><text x="1019" y="371" font-size="23" fill="#163D4A" font-weight="400" text-anchor="start">Review supports and connections.</text><text x="1019" y="408" font-size="23" fill="#163D4A" font-weight="400" text-anchor="start">Do not assume the climber carries shade.</text><circle cx="1041" cy="457" r="22" fill="#127E86"/><text x="1041" y="465" font-size="23" fill="white" font-weight="700" text-anchor="middle">2</text><text x="1081" y="465" font-size="28" fill="#163D4A" font-weight="700" text-anchor="start">CLIMBING</text><text x="1019" y="510" font-size="23" fill="#163D4A" font-weight="400" text-anchor="start">Confirm equipment and intended users.</text><text x="1019" y="547" font-size="23" fill="#163D4A" font-weight="400" text-anchor="start">Assess use zones, exits and surfacing.</text><text x="1019" y="584" font-size="23" fill="#163D4A" font-weight="400" text-anchor="start">Review visibility and maintenance access.</text><circle cx="1041" cy="633" r="22" fill="#127E86"/><text x="1041" y="641" font-size="23" fill="white" font-weight="700" text-anchor="middle">3</text><text x="1081" y="641" font-size="28" fill="#163D4A" font-weight="700" text-anchor="start">OPTIONAL MISTING</text><text x="1019" y="686" font-size="23" fill="#163D4A" font-weight="400" text-anchor="start">Assess drift, wetting and drainage.</text><text x="1019" y="723" font-size="23" fill="#163D4A" font-weight="400" text-anchor="start">Confirm water-system responsibilities.</text><text x="1019" y="760" font-size="23" fill="#163D4A" font-weight="400" text-anchor="start">Include a mist-off operating mode.</text><path d="M64 896H1536" fill="none" stroke="#D3DFD8" stroke-width="2" /><text x="64" y="936" font-size="22" fill="#526C71" font-weight="400" text-anchor="start">No dimensions, safety radius, wet-use approval, sun study or engineered drainage design is established.</text><text x="64" y="970" font-size="19" fill="#526C71" font-weight="400" text-anchor="start">Original vector editorial concept • Not to scale • No delivered AQUASEE project or available SKU depicted</text></g></svg>